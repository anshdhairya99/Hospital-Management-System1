spring.application.name=hospital-management
server.port=8080

# ---- Default: in-memory H2 (zero setup) ----
spring.datasource.url=jdbc:h2:mem:hospitaldb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
app.jwt.secret=change-this-secret-key-to-at-least-32-characters-long
app.jwt.expiration-ms=86400000

# ---- Seed admin ----
app.admin.username=admin
app.admin.password=admin123
